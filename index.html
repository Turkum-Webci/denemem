<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deneme yaz</title>
</head>
<body>
    <input type="text" id="iste" placeholder="Bir şey yaz...">
    <button onclick="A()">Gönder!</button>

    <div id="aa"></div>

    <script>
async function A() {
    const m = document.getElementById("iste").value;
    if (!m) return alert("Boş mesaj gönderilemez!");

    const yv = { user: "Anonim", text: m };

    const Token = "GITHUB_TOKEN"; 
    const repoowner = "turkum-webci";  
    const reponame = "denemem";  
    const filePath = "veri.json";  

    try {
        const response = await fetch(`https://api.github.com/repos/turkum-webci/denemem/contents/veri.json`, {
            headers: {
            Authorization: `Bearer ${Token}`, 
            Accept: "application/vnd.github.v3.raw"
            }
        });

        if (!response.ok) throw new Error("Dosya alınamadı!");

        const data = await response.json();
        const content = JSON.parse(atob(data.content));
        content.messages.push(yv); 

        const gnclveri = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));
        await fetch(`https://api.github.com/repos/turkum-webci/denemem/contents/veri.json`, {
            method: "PUT",
            headers: { Authorization: `Bearer ${Token}`, Accept: "application/vnd.github.v3+json" },
            body: JSON.stringify({
                message: "Yeni mesaj eklendi",
                content: gnclveri,
                sha: data.sha
            })
        });

        alert("Başarıyla gönderildi!");
        gosterMesajlar();
    } catch (error) {
        alert("Bir hata oluştu: " + error);
    }
}

async function gosterMesajlar() {
    try {
        const respon = await fetch(`https://raw.githubusercontent.com/turkum-webci/denemem/main/veri.json`);
        if (!respon.ok) throw new Error("Veri alınamadı!");

        const data = await respon.json();
        const messagesDiv = document.getElementById("aa");
        messagesDiv.innerHTML = ""; 
        data.messages.forEach(msg => {
            const p = document.createElement("p");
            p.textContent = `${msg.user}: ${msg.text}`;
            messagesDiv.appendChild(p);
        });
    } catch (error) {
        console.error("Veri çekme hatası:", error);
    }
}

window.onload = gosterMesajlar; 
    </script>
</body>
</html>
