<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deneme işte</title>
</head>
<body>
    <input type="text" id="iste" placeholder="Bişey yaz kafana göre">
    <button onclick="A()">Gönder !</button>
    <div id="aa"></div>
    <script>
async function A() {
    const m = document.getElementById("iste").value;

    const yv = {user:"Anonim", text:m};

    const Token = "GITHUB_TOKEN";
    const repoowner = "Turkum-Webci";
    const reponame = "denemem";
    const filePath = "veri.json";
    
    try {
        const response = await fetch(`https://api.github.com/repos/${repoowner}/${reponame}/contents/${filePath}`, {
        headers: {Authorization: `Bearer ${Token}` }
        });
        const data = await response.json();
        const content = JSON.parse(atob(data.content));
        content.messages.push(yv);
        
        const gnclveri = btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2))));
        response = await fetch(`https://api.github.com/repos/${repoowner}/${reponame}/contents/${filePath}`, {
            method: 'PUT',
            headers: {Authorization: `Bearer ${Token}` },
            body: JSON.stringify({
                message:"Güncelleme",
                content: gnclveri,
                sha: data.sha
            })
        });
            alert("Başarıyla Gönderildi !");
        }   catch (error) {
                alert("Bir Hata Oluştu: " + error);
        };
}
async function gosterMesajlar() {
    try {
        response = await fetch(`https://raw.githubusercontent.com/$/{repoowner}/$/{reponame}/$/{filePath}`);
        const data = await response.json();
        const m2 = document.getElementById("aa");
        m2.innerHTML = "";
        data.messages.forEach(msg => {
            const p = document.createElement("p");
            p.textContent = `${msg.user}: ${msg.text}`;
            m2.appendChild(p);
        });
    }catch (error) {
    console.error("Veri çekilemedi: ", error);
    }
    }
    window.onload = gosterMesajlar;
    </script>
</body>
</html>
